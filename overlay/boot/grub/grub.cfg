set timeout=30

loadfont unicode

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

# NVIDIA N1x (ASUS ProArt P14 H7407BA) boot contract, after Omarchy install/hardware/n1x.sh:
#  console=tty0 acpi=nospcr        firmware SPCR UART must not steal the console
#  mem_sleep_default=s2idle        firmware deep sleep returns at once
#  iommu.passthrough=1             NVIDIA/Omarchy default; the iGPU still gets a DMA domain (SMMU quirk)
#  power_wrap_drv.usb4_release=0   keep USB4 host routers; pci=hpbus* leaves room for docks (P14)
#  log_buf_len=4M                  keep the whole boot in dmesg
set n1x_base="console=tty0 acpi=nospcr earlycon mem_sleep_default=s2idle iommu.passthrough=1 power_wrap_drv.usb4_release=0 pci=hpbussize=0x80,hpmmiosize=32M,hpmmioprefsize=32G log_buf_len=4M"
# ASUS firmware (.300 and .303 checked): SSPM, COM1-3, SVP0 and HFRP have
# _STA { If (_OSI("Windows 2022")) Return (0) }, i.e. they are hidden from
# Windows 11 22H2+ and meant to be visible to any other OS. Linux >= 6.12
# answers that string, so the SSPM mailbox vanishes, power_wrap fails and
# i2c-mt65xx (keyboard, touchpad), audio DSPs and USB4 never bind.
# The parameter must be written literally on the linux line: GRUB quotes an
# argument that contains a space when it builds the kernel command line, but
# a variable holding quotes is split on the space and the quotes get escaped.
# Live quirks stay off the installed GRUB line. Snapd is left running so the
# desktop installer and the seeded snaps can start.
set live_quirks="systemd.mask=systemd-udev-settle.service rd.systemd.device-timeout=5s systemd.device-timeout=5s systemd.mask=iio-sensor-proxy.service"
set nvidia_off="nomodeset modprobe.blacklist=nvidia,nvidia_drm,nvidia_modeset,nvidia_uvm,nvidia_peermem,nouveau nvidia_drm.modeset=0"
set verbose="loglevel=7 ignore_loglevel systemd.show_status=1 systemd.log_target=console vt.global_cursor_default=1"
set cmdline_base="$n1x_base $live_quirks"

smbios --type 4 --get-string 5 --set proc_version
regexp "Snapdragon.*" "$proc_version"
if [ $? = 0 ]; then
  if [ $lockdown != "y" ]; then
    cutmem 0x8800000000 0x8fffffffff
  fi
  set cmdline_base="$cmdline_base arm64.nopauth clk_ignore_unused pd_ignore_unused"
fi

menuentry "1. Ubuntu N1X - text console, NVIDIA off (safe, start here)" {
    set gfxpayload=text
    linux  /casper/vmlinuz $cmdline_base acpi_osi="!Windows 2022" $nvidia_off systemd.unit=multi-user.target $verbose ---
    initrd /casper/initrd
}

menuentry "2. Ubuntu N1X - text console, NVIDIA loaded, no KMS" {
    set gfxpayload=text
    linux  /casper/vmlinuz $cmdline_base acpi_osi="!Windows 2022" nvidia_drm.modeset=0 systemd.unit=multi-user.target $verbose ---
    initrd /casper/initrd
}

menuentry "3. Ubuntu N1X - desktop on NVIDIA GPU (BIOS H7407BA.302+)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz $cmdline_base acpi_osi="!Windows 2022" nvidia_drm.modeset=1 nvidia_drm.fbdev=1 initcall_blacklist=simpledrm_platform_driver_init ---
    initrd /casper/initrd
}

menuentry "4. Ubuntu N1X - desktop, software rendering (NVIDIA off)" {
    set gfxpayload=keep
    linux  /casper/vmlinuz $cmdline_base acpi_osi="!Windows 2022" $nvidia_off ---
    initrd /casper/initrd
}

menuentry "5. Rescue shell (NVIDIA off)" {
    set gfxpayload=text
    linux  /casper/vmlinuz $cmdline_base acpi_osi="!Windows 2022" $nvidia_off systemd.unit=rescue.target $verbose ---
    initrd /casper/initrd
}

menuentry "6. Text console, NVIDIA off, firmware default _OSI (no SSPM: compare only)" {
    set gfxpayload=text
    linux  /casper/vmlinuz $cmdline_base $nvidia_off systemd.unit=multi-user.target $verbose ---
    initrd /casper/initrd
}

menuentry 'UEFI Firmware Settings' {
    fwsetup
}
