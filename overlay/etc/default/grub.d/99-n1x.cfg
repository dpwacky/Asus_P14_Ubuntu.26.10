GRUB_CMDLINE_LINUX_DEFAULT="console=tty0 acpi=nospcr earlycon mem_sleep_default=s2idle iommu.passthrough=1 power_wrap_drv.usb4_release=0 pci=hpbussize=0x80,hpmmiosize=32M,hpmmioprefsize=32G log_buf_len=4M acpi_osi=\"!Windows 2022\" nvidia_drm.modeset=1 nvidia_drm.fbdev=1 initcall_blacklist=simpledrm_platform_driver_init"
GRUB_CMDLINE_LINUX=""
